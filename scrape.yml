name: s
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios cheerio
      - run: node scripts/scrape.js
      - run: |
          git config --local user.email "a@a.com"
          git config --local user.name "a"
          git add data/lottery.json
          git diff --staged --quiet || git commit -m "u"
          git push
